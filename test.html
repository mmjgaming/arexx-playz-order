<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCTiers Clone</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --bg:#050b16;
    --surface:#091120;
    --surface2:#0d1728;
    --border:#152544;
    --text:#ffffff;
    --muted:#8da0c3;
    --blue:#5ea8ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:linear-gradient(to bottom,#040913,#071120);
    color:white;
    min-height:100vh;
}

/* NAVBAR */

header{
    position:sticky;
    top:0;
    z-index:999;
    background:#07101d;
    border-bottom:1px solid #111e37;
}

.nav{
    height:86px;
    max-width:1850px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:-3px;
    background:linear-gradient(to bottom,#ffd857,#ff8f2e);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.links{
    display:flex;
    gap:40px;
    align-items:center;
}

.links a{
    text-decoration:none;
    color:#8ea2c7;
    font-size:18px;
    font-weight:600;
    transition:.2s;
}

.links a:hover{
    color:white;
}

.links i{
    margin-right:8px;
}

.search{
    width:320px;
    height:54px;
    background:#0c1729;
    border:1px solid #1a2a47;
    border-radius:18px;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.search input{
    background:none;
    border:none;
    outline:none;
    color:white;
    width:100%;
    font-size:15px;
    margin-left:10px;
}

.search i{
    color:#7f92b6;
}

/* TABS */

.tabs{
    max-width:1850px;
    margin:22px auto;
    padding:0 30px;
    display:flex;
    gap:16px;
    overflow-x:auto;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    min-width:150px;
    height:95px;
    background:#091120;
    border:2px solid #142340;
    border-radius:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#7f93ba;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

.tab:hover{
    transform:translateY(-5px);
    border-color:#3668c7;
}

.tab.active{
    background:#0e1727;
    border-color:#5ca8ff;
    color:white;
}

.tab i{
    font-size:28px;
    margin-bottom:10px;
}

/* PAGE */

.wrapper{
    max-width:1850px;
    margin:auto;
    padding:0 30px 40px;
}

.topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:25px;
}

.info{
    background:#172641;
    padding:14px 22px;
    border-radius:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
}

/* ROWS */

.leaderboard{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.row{
    background:#091120;
    border:1px solid #13213b;
    border-radius:26px;
    display:flex;
    align-items:center;
    overflow:hidden;
    transition:.25s;
}

.row:hover{
    transform:translateY(-4px);
    background:#0d1728;
}

/* RANK BOX */

.rankbox{
    width:250px;
    height:120px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.gold{
    background:linear-gradient(135deg,#efc14d,#c88d2f);
}

.silver{
    background:linear-gradient(135deg,#b6c2cb,#7f919d);
}

.bronze{
    background:linear-gradient(135deg,#ca7a3b,#955423);
}

.rank{
    font-size:62px;
    font-weight:900;
    color:white;
    margin-left:28px;
    text-shadow:0 5px 12px rgba(0,0,0,.3);
}

.skin{
    position:absolute;
    right:15px;
    bottom:0;
    width:85px;
    height:85px;
    image-rendering:pixelated;
}

/* PLAYER */

.player{
    flex:1;
    padding-left:35px;
}

.player h2{
    font-size:54px;
    font-weight:800;
    letter-spacing:-2px;
}

.player p{
    margin-top:7px;
    color:#91a3c6;
    font-size:25px;
}

.player span{
    color:#ffdc6c;
    font-weight:700;
}

/* REGION */

.region{
    width:120px;
    display:flex;
    justify-content:center;
}

.badge{
    width:70px;
    height:70px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:28px;
}

.na{
    background:#5b2230;
    color:#ff667f;
}

.eu{
    background:#214920;
    color:#73ff73;
}

/* TIERS */

.tiers{
    width:680px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    padding-right:30px;
}

.tier{
    width:76px;
    height:76px;
    border-radius:50%;
    border:4px solid #23324f;
    background:#08111f;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:800;
}

.tier i{
    font-size:25px;
    margin-bottom:4px;
}

.ht1{
    color:#ffe36d;
    border-color:#6d5b2a;
}

.ht2{
    color:#7cc0ff;
    border-color:#275982;
}

.lt2{
    color:#9ea8bf;
    border-color:#47526a;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:450px;
    background:#091120;
    border:1px solid #1a2a47;
    border-radius:24px;
    overflow:hidden;
}

.banner{
    height:120px;
    background:linear-gradient(135deg,#2458b8,#0f1727);
}

.profile{
    padding:0 30px 30px;
    margin-top:-60px;
    text-align:center;
}

.profile img{
    width:120px;
    height:120px;
    image-rendering:pixelated;
    border-radius:18px;
    border:5px solid #091120;
}

.profile h1{
    margin-top:14px;
    font-size:38px;
}

.profile p{
    color:#92a4c6;
    margin-top:10px;
}

.close{
    position:absolute;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:#ff4d4d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* FOOTER */

footer{
    text-align:center;
    padding:40px 20px;
    color:#7183a4;
    font-size:14px;
}

/* MOBILE */

@media(max-width:1200px){

    .row{
        flex-direction:column;
        align-items:flex-start;
    }

    .tiers{
        width:100%;
        padding:20px 30px;
    }

    .region{
        padding:20px 30px;
    }

}

@media(max-width:700px){

    .links{
        display:none;
    }

    .search{
        width:180px;
    }

    .player h2{
        font-size:34px;
    }

    .player p{
        font-size:18px;
    }

    .rank{
        font-size:48px;
    }

}

</style>
</head>
<body>

<header>

<div class="nav">

<div class="logo">MCTIERS</div>

<div class="links">
<a href="#"><i class="fa-solid fa-house"></i> Home</a>
<a href="#"><i class="fa-solid fa-trophy"></i> Rankings</a>
<a href="#"><i class="fa-solid fa-gamepad"></i> Discords</a>
<a href="#"><i class="fa-solid fa-file"></i> API Docs</a>
</div>

<div class="search">
<i class="fa-solid fa-magnifying-glass"></i>
<input placeholder="Search player..." id="searchInput">
</div>

</div>

</header>

<!-- TABS -->

<div class="tabs">

<div class="tab active">
<i class="fa-solid fa-trophy"></i>
Overall
</div>

<div class="tab">
<i class="fa-solid fa-shield"></i>
LTMs
</div>

<div class="tab">
<i class="fa-solid fa-gem"></i>
Vanilla
</div>

<div class="tab">
<i class="fa-solid fa-heart"></i>
UHC
</div>

<div class="tab">
<i class="fa-solid fa-flask"></i>
Pot
</div>

<div class="tab">
<i class="fa-solid fa-cube"></i>
NethOP
</div>

<div class="tab">
<i class="fa-solid fa-circle"></i>
SMP
</div>

<div class="tab">
<i class="fa-solid fa-sword"></i>
Sword
</div>

<div class="tab">
<i class="fa-solid fa-axe-battle"></i>
Axe
</div>

</div>

<!-- MAIN -->

<div class="wrapper">

<div class="topbar">
<div class="info">
<i class="fa-solid fa-circle-info"></i>
Information
</div>
</div>

<div class="leaderboard" id="leaderboard">

</div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="banner"></div>

<div class="profile">

<img id="profileSkin">

<h1 id="profileName"></h1>

<p>Premium Minecraft Player</p>

</div>

</div>

<button class="close" onclick="closeModal()">
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<footer>
© 2026 MCTIERS Clone — Premium Minecraft PvP Rankings
</footer>

<script>

/* PREMIUM SKIN API */

function getSkin(username){
    return `https://visage.surgeplay.com/full/128/${username}`;
}

function getFace(username){
    return `https://visage.surgeplay.com/face/256/${username}`;
}

/* PLAYERS */

const players = [

{
    rank:1,
    name:"ItzRealMe",
    points:330,
    region:"NA",
    color:"gold",
    tiers:["HT3","HT1","HT1","HT1","LT2","LT2"]
},

{
    rank:2,
    name:"coldified",
    points:326,
    region:"EU",
    color:"silver",
    tiers:["LT1","LT1","LT3","HT1","HT1","LT1"]
},

{
    rank:3,
    name:"Swight",
    points:290,
    region:"NA",
    color:"bronze",
    tiers:["HT3","LT3","HT1","HT1","LT2"]
}

];

/* RENDER */

const leaderboard = document.getElementById("leaderboard");

function renderPlayers(data){

    leaderboard.innerHTML = "";

    data.forEach(player=>{

        const row = document.createElement("div");
        row.className = "row";

        row.innerHTML = `

        <div class="rankbox ${player.color}">

            <div class="rank">${player.rank}.</div>

            <img
            class="skin"
            src="${getSkin(player.name)}">

        </div>

        <div class="player">
            <h2>${player.name}</h2>
            <p><span>Combat Master</span> (${player.points} points)</p>
        </div>

        <div class="region">
            <div class="badge ${player.region.toLowerCase()}">
                ${player.region}
            </div>
        </div>

        <div class="tiers">

            ${player.tiers.map(t=>`

                <div class="tier ${t.includes('HT') ? 'ht1':'lt2'}">
                    <i class="fa-solid fa-sword"></i>
                    ${t}
                </div>

            `).join("")}

        </div>

        `;

        row.onclick = ()=>openModal(player);

        leaderboard.appendChild(row);

    });

}

renderPlayers(players);

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input",e=>{

    const value = e.target.value.toLowerCase();

    const filtered = players.filter(p=>
        p.name.toLowerCase().includes(value)
    );

    renderPlayers(filtered);

});

/* MODAL */

const modal = document.getElementById("modal");

function openModal(player){

    modal.classList.add("active");

    document.getElementById("profileSkin").src =
    getFace(player.name);

    document.getElementById("profileName").innerText =
    player.name;

}

function closeModal(){
    modal.classList.remove("active");
}

window.onclick = e=>{
    if(e.target === modal){
        closeModal();
    }
}

</script>

</body>
</html>
