  .ip-info p { color: var(--text2); font-size: 12px; }
  .ip-copy-container { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 7px 14px; border-radius: 8px; border: 1px solid var(--primary); box-shadow: 0 0 16px rgba(108, 92, 231, 0.1); }
  .ip-text { color: var(--primary2); font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 700; font-size: 15px; }
  .copy-btn { background: var(--primary); color: var(--white); border: none; padding: 6px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; transition: background 0.2s, transform 0.1s; }

  /* ── SEARCH BAR ── */
  .search-wrap { position: relative; margin-bottom: 20px; animation: fadeIn 0.5s ease-out; }
  .search-bar { width: 100%; background: var(--surface); border: 1px solid var(--surface2); border-radius: 8px; padding: 12px 44px 12px 44px; color: var(--white); font-size: 14px; font-weight: 500; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }

  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 15px; pointer-events: none; transition: color 0.2s; }

  .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--surface2); border: none; color: var(--text2); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 12px; display: none; align-items: center; justify-content: center; transition: all 0.15s; }
  .search-clear:hover { background: var(--primary); color: var(--white); }

  .tabs::-webkit-scrollbar { height: 3px; }
  .tabs::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
  .tab-btn { background: var(--surface); color: var(--text2); border: 1px solid var(--surface2); padding: 10px 16px 8px; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 700; transition: all 0.2s; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.8px; min-width: 72px; }
  .tab-btn:hover { background: var(--surface2); color: var(--white); transform: translateY(-2px); border-color: var(--surface3); }

  .tab-btn:hover img { transform: scale(1.1); filter: grayscale(0%); opacity: 1; }
  .tab-btn.active img { filter: grayscale(0%); opacity: 1; }
  .tab-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }

  .lb-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--surface2); }
  .lb-table th { background: var(--bg); color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--surface2); }

  .tier-section { margin-bottom: 40px; animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
  .tier-header { font-size: 20px; font-weight: 700; color: var(--white); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--surface2); }

  .tier-card { background: var(--surface); border: 1px solid var(--surface2); border-radius: 8px; padding: 20px 10px; text-align: center; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; cursor: pointer; }
  .tier-card:hover { transform: translateY(-6px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.15); }
  .tier-card .mc-skin { width: 64px; height: 64px; margin: 0 auto 12px; display: block; transition: transform 0.3s; }

  .ltm-icon img { width: 72px; height: 72px; }
  .ltm-container h2 { color: var(--white); font-size: 26px; font-weight: 800; margin-bottom: 12px; }
  .ltm-container p { color: var(--text2); font-size: 15px; line-height: 1.7; max-width: 480px; margin: 0 auto; }

  /* ── PROFILE MODAL ── */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,7,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }

</style>

    vanilla: '<img src="vanilla.svg" width="12" height="12" alt="Vanilla">',
    uhc:     '<img src="uhc.svg" width="12" height="12" alt="UHC">',
    pot:     '<img src="pot.svg" width="12" height="12" alt="Pot">',
    nethop:  '<img src="nethop.svg" width="12" height="12" alt="NethOP">',
    smp:     '<img src="smp.svg" width="12" height="12" alt="SMP">',
    sword:   '<img src="sword.svg" width="12" height="12" alt="Sword">',
    axe:     '<img src="axe.svg" width="12" height="12" alt="Axe">',
    mace:    '<img src="mace.svg" width="12" height="12" alt="Mace">'
  };

  const catModal = {
    overall: '<img src="overall.svg" width="16" height="16" alt="Overall">',
    vanilla: '<img src="vanilla.svg" width="16" height="16" alt="Vanilla">',
    uhc:     '<img src="uhc.svg" width="16" height="16" alt="UHC">',
    pot:     '<img src="pot.svg" width="16" height="16" alt="Pot">',
    nethop:  '<img src="nethop.svg" width="16" height="16" alt="NethOP">',
    smp:     '<img src="smp.svg" width="16" height="16" alt="SMP">',
    sword:   '<img src="sword.svg" width="16" height="16" alt="Sword">',
    axe:     '<img src="axe.svg" width="16" height="16" alt="Axe">',
    mace:    '<img src="mace.svg" width="16" height="16" alt="Mace">'
  };

  const dbCategories = ['vanilla','uhc','pot','nethop','smp','sword','axe','mace'];
  const regionNames = { 'NA':'North America', 'EU':'Europe', 'AS':'Asia', 'AU':'Australia', 'SA':'South America', 'ME':'Middle East', 'AF':'Africa' };

  let activeTab = 'overall';
  let allPlayersCache = [];

  const mockTopPlayers = [
    { username: 'ItzRealMe', points: 330, region: 'NA', vanilla: 'HT3', uhc: 'HT2', pot: 'HT1', sword: 'HT2', nethop: 'HT1', smp: 'HT1', axe: 'HT1', mace: 'HT2' },
    { username: 'coldified', points: 326, region: 'EU', vanilla: 'LT1', uhc: 'HT1', pot: 'HT2', sword: 'HT1', nethop: 'LT2', smp: 'LT1', axe: 'LT1', mace: 'HT1' },
    { username: 'Swight', points: 290, region: 'NA', vanilla: 'HT3', uhc: 'LT2', pot: 'HT2', sword: 'HT3', nethop: 'LT1', smp: 'HT2', axe: 'LT3', mace: 'HT2' }
  ];

  function init() { renderTabs(); renderContent(); }

  function renderTabs() {
    const tabs = document.getElementById('tabContainer');
    const categories = ['overall', ...dbCategories, 'ltm'];
    tabs.innerHTML = categories.map(cat => {
      const name = cat === 'ltm' ? 'LTMs' : cat.charAt(0).toUpperCase() + cat.slice(1);
      return `<button class="tab-btn ${cat === activeTab ? 'active' : ''}" onclick="switchTab('${cat}')">${catIcons[cat] || ''}<span class="tab-label">${name}</span></button>`;
    }).join('');
  }

  function switchTab(tab) { activeTab = tab; renderTabs(); renderContent(); }

  /* ── SEARCH ── */
  function handleSearch() {
    const bar = document.getElementById('searchBar');
    const clear = document.getElementById('searchClear');
    clear.classList.toggle('visible', bar.value.length > 0);
    renderContent();
  }

  function clearSearch() {
    document.getElementById('searchBar').value = '';
    document.getElementById('searchClear').classList.remove('visible');
    renderContent();
  }

  function getFilteredPlayers() {
    const q = document.getElementById('searchBar').value.trim().toLowerCase();
    if (!q) return allPlayersCache;
    return allPlayersCache.filter(p => p.username.toLowerCase().includes(q));
  }

  async function renderContent() {
    const content = document.getElementById('contentArea');
    content.innerHTML = `<div class="loading-box"><i class="fas fa-spinner fa-spin"></i> Fetching ${activeTab} rankings...</div>`;

    if (allPlayersCache.length === 0) {
      try {
        const res = await fetch(`${API_BASE}/players?select=*&order=points.desc.nullslast`, { headers });
        let apiData = await res.json();
        if (!apiData || apiData.length === 0) { allPlayersCache = mockTopPlayers; } else { allPlayersCache = apiData; }
      } catch (e) { allPlayersCache = mockTopPlayers; }
    }

    if (activeTab === 'overall') { renderOverall(content); }
    else if (activeTab === 'ltm') { renderLTM(content); }
    else { renderCategory(content, activeTab); }
  }

  /* ── TITLES WITH EMOJIS ── */
  function getPlayerTitle(points) {
    if (points >= 300) return { text: '👑 Combat Master', class: 'badge-master' };
    if (points >= 200) return { text: '⚔️ Combat Ace', class: 'badge-ace' };
    return { text: '🛡️ Warrior', class: 'badge-warrior' };
  }

  function renderOverall(container) {
    const data = getFilteredPlayers();
    if (!data || data.length === 0) { container.innerHTML = `<div class="empty-state"><h3>No Players Found</h3><p style="margin-top:8px;font-size:13px">Try a different search.</p></div>`; return; }

    let html = `<table class="lb-table"><thead><tr><th>#</th><th>Player</th><th>Tiers</th></tr></thead><tbody>`;
    data.forEach((p, index) => {
      let tierTags = '';
      dbCategories.forEach(cat => {
        if (p[cat]) {
          const tierStr = p[cat].toUpperCase();
          const num = tierStr.replace(/[^0-9]/g,'');
          const cls = tierStr.startsWith('H') ? `t-ht${num}` : `t-lt${num}`;
          const iconHtml = catTags[cat] || '';
          tierTags += `<div class="tier-tag ${cls}">${iconHtml} ${tierStr}</div>`;
        }
      });
      const globalRank = allPlayersCache.findIndex(pl => pl.username === p.username) + 1;
      const reg = (p.region || 'NA').toUpperCase();
      const rowClass = globalRank <= 3 ? `rank-row-${globalRank}` : '';
      const rankClass = globalRank <= 3 ? `rank-cell-${globalRank}` : '';
      const titleInfo = getPlayerTitle(p.points || 0);
      
      html += `<tr class="animate-row ${rowClass}" style="animation-delay: ${index * 50}ms">
        <td class="rank-cell ${rankClass}">${globalRank}</td>
        <td><div class="player-cell" onclick="openProfile('${p.username}')">
          <img class="mc-skin" src="${getAvatar(p.username,48)}" alt="${p.username}" loading="lazy">
          <div><span class="p-name">${p.username}</span><span class="p-title">${titleInfo.text} (${p.points || 0} points)</span></div>
          <span class="region-badge r-${reg.toLowerCase()}">${reg}</span>
        </div></td>
        <td><div class="tier-tags">${tierTags}</div></td>
      </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function renderCategory(container, catName) {
    const data = getFilteredPlayers();
    if (!data || data.length === 0) { container.innerHTML = `<div class="empty-state"><h3>No Players Found</h3></div>`; return; }

    const tiers = { 1: [], 2: [], 3: [], 4: [], 5: [] };
    data.forEach(p => {
      if (p[catName] && p[catName].trim() !== '') {
        const tierVal = parseInt(p[catName].replace(/[^0-9]/g, ''));
        if (tierVal >= 1 && tierVal <= 5) tiers[tierVal].push(p);
      }
    });

    let html = ''; let sectionDelay = 0; let hasAnyTiers = false;
    for (const [tierNum, players] of Object.entries(tiers)) {
      if (players.length === 0) continue;
      hasAnyTiers = true;
      html += `<section class="tier-section tier-${tierNum}" style="animation-delay: ${sectionDelay}ms"><div class="tier-header"><i class="fas fa-layer-group"></i> Tier ${tierNum}</div><div class="tier-grid">`;
      let cardDelay = 0;
      players.forEach(p => {
        const reg = (p.region || 'NA').toUpperCase();
        html += `<article class="tier-card animate-card" style="animation-delay: ${cardDelay}ms" onclick="openProfile('${p.username}')">
          <img class="mc-skin" src="${getAvatar(p.username,64)}" alt="${p.username}" loading="lazy">
          <div class="p-name">${p.username}</div>
          <span class="region-badge r-${reg.toLowerCase()}">${reg}</span>
        </article>`;
        cardDelay += 60;
      });
      html += `</div></section>`; sectionDelay += 150;
    }
    container.innerHTML = hasAnyTiers ? html : `<div class="empty-state"><h3>No ${catName} tiers found</h3></div>`;
  }

  function renderLTM(container) {
    container.innerHTML = `<div class="ltm-container">
      <div class="ltm-icon"><img src="2v2.svg" width="72" height="72" alt="LTMs"></div>
      <h2>Limited-Time Modes are coming!</h2>
      <p>We are currently developing limited-time modes, which will include a team-based leaderboard. Stay tuned for more information!</p>
    </div>`;
  }

  function getCategoryRank(username, catName) {
    const playersInCat = allPlayersCache.filter(p => p[catName] && p[catName].trim() !== '');
    playersInCat.sort((a, b) => (b.points || 0) - (a.points || 0));
    const rank = playersInCat.findIndex(p => p.username === username) + 1;
    return rank > 0 ? rank : null;
  }

  function openProfile(username) {
    document.getElementById('profileUsername').innerText = username;
    document.getElementById('profileAvatar').src = getHead(username, 128);
    document.getElementById('profileBadges').innerHTML = '<i class="fas fa-spinner fa-spin" style="color:var(--text2)"></i>';
    document.getElementById('profilePosition').innerHTML = '';
    document.getElementById('profileTiers').innerHTML = '';
    document.getElementById('profileModal').classList.add('active');

    try {
      const p = allPlayersCache.find(player => player.username === username);
      if (p) {
        const pts = p.points || 0;
        const titleInfo = getPlayerTitle(pts);
        const regionFull = regionNames[p.region] || p.region;
        const overallRank = allPlayersCache.findIndex(player => player.username === username) + 1;

        document.getElementById('profileBadges').innerHTML = `
          <span class="p-badge ${titleInfo.class}">${titleInfo.text}</span>
          <span class="p-badge badge-region"><i class="fas fa-globe-americas"></i> ${regionFull}</span>`;

        document.getElementById('profilePosition').innerHTML = `
          <div class="stat-label">Position</div>
          <div class="stat-value">#${overallRank}</div>
          <div class="stat-sub">${titleInfo.text} (${pts} points)</div>`;

        let tiersHtml = '';
        dbCategories.forEach(cat => {
          if (p[cat] && p[cat].trim() !== '') {
            const tierStr = p[cat].toUpperCase();
            const catRank = getCategoryRank(username, cat);
            const iconHtml = catModal[cat] || '';
            tiersHtml += `
              <div class="p-tier-item">
                <span class="p-tier-icon">${iconHtml}</span>
                <span class="p-tier-name">${cat.charAt(0).toUpperCase() + cat.slice(1)}</span>
                <span class="p-tier-rank">${tierStr} ${catRank ? `(#${catRank})` : ''}</span>
              </div>`;
          }
        });
        document.getElementById('profileTiers').innerHTML = tiersHtml || '<span style="color:var(--text2);font-size:13px">No tiers assigned yet.</span>';
      } else {
        document.getElementById('profileBadges').innerHTML = '<span class="p-badge badge-region">Unknown Player</span>';
      }
    } catch (e) {
      document.getElementById('profileBadges').innerHTML = '<span style="color:red;">Error loading</span>';
    }
  }

  function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }
  function copyIP() { navigator.clipboard.writeText(SERVER_IP); showToast("IP Copied to clipboard!"); }
  function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  window.onclick = function(event) { if (event.target == document.getElementById('profileModal')) closeProfile(); }
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeProfile(); });
  init();
</script>
</body>
</html>
